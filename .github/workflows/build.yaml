name: Build ComponentTester 1.57m (AY-AT 8MHz)

on:
  workflow_dispatch:
    inputs:
      lcd_driver:
        description: "Display controller (try LCD_SEMI_ST7735 if display is garbled)"
        type: choice
        default: "LCD_ST7735"
        options:
          - "LCD_ST7735"
          - "LCD_SEMI_ST7735"
      lcd_flip_x:
        description: "Horizontal flip (LCD_FLIP_X)"
        type: boolean
        default: true
      lcd_flip_y:
        description: "Vertical flip (LCD_FLIP_Y)"
        type: boolean
        default: false
      lcd_bgr:
        description: "Swap Red/Blue channels (LCD_BGR)"
        type: boolean
        default: false
      lcd_offset_x:
        description: "X dot offset (0 = disabled; try 2 or 4 if image is shifted)"
        type: string
        default: "0"
      lcd_offset_y:
        description: "Y dot offset (0 = disabled; try 1 or 2 if image is shifted)"
        type: string
        default: "0"
      symbols:
        description: "Component icon size (24x24 leaves more flash for extra features)"
        type: choice
        default: "SYMBOLS_24X24_HF"
        options:
          - "SYMBOLS_24X24_HF"
          - "SYMBOLS_30X32_HF"
      hw_ref25:
        description: "Enable 2.5V reference (HW_REF25 - enable only if using precision ref or tested TL431)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install AVR toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-avr avr-libc binutils-avr make

      - name: Fetch and extract ComponentTester 1.57m
        run: |
          git clone --depth 1 https://github.com/kubi48/TransistorTester-source.git repo
          TARBALL=$(ls repo/Markus/*1.57m*.t*gz | head -n 1)
          echo "Using archive: $TARBALL"
          test -n "$TARBALL"
          mkdir -p extract
          tar -xzf "$TARBALL" -C extract

      - name: Configure for AY-AT (8 MHz, ST7735) and auto-pack features
        env:
          LCD_DRIVER: ${{ inputs.lcd_driver }}
          LCD_FLIP_X: ${{ inputs.lcd_flip_x }}
          LCD_FLIP_Y: ${{ inputs.lcd_flip_y }}
          LCD_BGR: ${{ inputs.lcd_bgr }}
          LCD_OFFSET_X: ${{ inputs.lcd_offset_x }}
          LCD_OFFSET_Y: ${{ inputs.lcd_offset_y }}
          SYMBOLS: ${{ inputs.symbols }}
          HW_REF25: ${{ inputs.hw_ref25 }}
        run: |
          python3 - << 'EOF'
          import os, re, shutil, subprocess, sys
          from pathlib import Path

          ENC = "latin-1"
          FLASH_MAX = 32768
          EEPROM_MAX = 1024

          # Locate extracted source directory
          src_dir = None
          for p in Path("extract").rglob("config_328.h"):
              src_dir = p.parent
              break
          if not src_dir:
              sys.exit("ERROR: Could not locate config_328.h in extracted archive.")
          print(f"Source directory: {src_dir}")

          def has_macro(text, name):
              return re.search(rf"(?m)^\s*(?://\s*)?#define\s+{re.escape(name)}\b", text) is not None

          def enable_macro(text, name):
              return re.sub(
                  rf"(?m)^(\s*)//\s*(#define\s+{re.escape(name)}\b)",
                  r"\1\2",
                  text,
              )

          def disable_macro(text, name):
              return re.sub(
                  rf"(?m)^(\s*)(#define\s+{re.escape(name)}\b)",
                  r"\1//\2",
                  text,
              )

          def set_macro_first(text, name, val):
              text = disable_macro(text, name)
              return re.sub(
                  rf"(?m)^(\s*)//\s*(#define\s+{re.escape(name)})(?:\s+(?!/\*)\S+)?",
                  rf"\1\2 {val}",
                  text,
                  count=1,
              )

          def parse_avr_size_total(fpath):
              out = subprocess.check_output(["avr-size", "-A", str(fpath)], text=True)
              for line in out.splitlines():
                  parts = line.split()
                  if len(parts) >= 2 and parts[0].lower() == "total":
                      return int(parts[1])
              return 0

          def build_and_measure():
              subprocess.run(
                  ["make", "clean"],
                  cwd=src_dir,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              res = subprocess.run(
                  ["make", f"-j{os.cpu_count() or 2}"],
                  cwd=src_dir,
                  capture_output=True,
                  text=True,
              )
              if res.returncode != 0:
                  return False, 0, 0, 0, (res.stdout + "\n" + res.stderr)

              elf_files = sorted(src_dir.rglob("*.elf"))
              if elf_files:
                  out = subprocess.check_output(
                      ["avr-size", "-A", str(elf_files[0])],
                      text=True,
                  )
                  secs = {}
                  for line in out.splitlines():
                      parts = line.split()
                      if len(parts) >= 2 and parts[0].startswith("."):
                          try:
                              secs[parts[0]] = int(parts[1])
                          except ValueError:
                              pass
                  flash = secs.get(".text", 0) + secs.get(".data", 0)
                  ram = secs.get(".data", 0) + secs.get(".bss", 0)
                  eeprom = secs.get(".eeprom", 0)
              else:
                  hex_files = sorted(src_dir.rglob("*.hex"))
                  eep_files = sorted(src_dir.rglob("*.eep"))
                  if not hex_files:
                      listing = ", ".join(sorted(p.name for p in src_dir.iterdir()))
                      return False, 0, 0, 0, f"No .elf or .hex produced.\nFiles: {listing}\n{res.stdout}\n{res.stderr}"
                  flash = parse_avr_size_total(hex_files[0])
                  ram = 0
                  eeprom = parse_avr_size_total(eep_files[0]) if eep_files else 0

              ok = (flash > 0) and (flash <= FLASH_MAX) and (eeprom <= EEPROM_MAX)
              return ok, flash, ram, eeprom, res.stderr

          # 1. Patch Makefile (ATmega328P @ 8 MHz)
          mk_path = src_dir / "Makefile"
          mk = mk_path.read_text(encoding=ENC)
          mk = re.sub(r"(?m)^MCU\s*=.*", "MCU = atmega328", mk)
          mk = re.sub(r"(?m)^FREQ\s*=.*", "FREQ = 8", mk)
          mk_path.write_text(mk, encoding=ENC)

          # 2. Patch config_328.h — disable EVERY display block (including //#if 0 ... //#endif), then enable only ST7735
          c328_path = src_dir / "config_328.h"
          lines = c328_path.read_text(encoding=ENC).splitlines(keepends=True)

          stack = []
          display_blocks = []
          disp_re = re.compile(
              r"(?m)^\s*(?://\s*)?#define\s+(?:LCD_GRAPHIC|LCD_TEXT|LCD_DOTS_X|LCD_CHAR_X)\b"
          )

          for idx, ln in enumerate(lines):
              if re.match(r"^\s*//\s*#\s*if\s+[01]\b", ln):
                  stack.append(("toggle_commented", idx))
              elif re.match(r"^\s*//\s*#\s*endif\b", ln):
                  if stack and stack[-1][0] == "toggle_commented":
                      _, s_idx = stack.pop()
                      if disp_re.search("".join(lines[s_idx + 1 : idx])):
                          display_blocks.append((s_idx, idx))
              elif re.match(r"^\s*#\s*if\s+[01]\b", ln):
                  stack.append(("toggle", idx))
              elif re.match(r"^\s*#\s*(?:if|ifdef|ifndef)\b", ln):
                  stack.append(("normal", idx))
              elif re.match(r"^\s*#\s*endif\b", ln):
                  if stack:
                      kind, s_idx = stack.pop()
                      if kind == "toggle" and disp_re.search("".join(lines[s_idx + 1 : idx])):
                          display_blocks.append((s_idx, idx))

          for s_idx, e_idx in display_blocks:
              lines[s_idx] = "#if 0\n"
              lines[e_idx] = "#endif\n"

          st_matches = [
              (s, e)
              for (s, e) in display_blocks
              if re.search(
                  r"(?m)^\s*(?://\s*)?#define\s+LCD_ST7735\b",
                  "".join(lines[s + 1 : e]),
              )
          ]
          if not st_matches:
              sys.exit("ERROR: Could not locate ST7735 block in config_328.h")

          st_start, st_end = min(st_matches, key=lambda pair: pair[1] - pair[0])
          print(f"Disabled {len(display_blocks)} display block(s); enabling ST7735 (lines {st_start + 1}-{st_end + 1})")

          lines[st_start] = "#if 1\n"
          lines[st_end] = "#endif\n"
          block = "".join(lines[st_start + 1 : st_end])

          # Driver choice
          if os.environ["LCD_DRIVER"] == "LCD_SEMI_ST7735":
              if has_macro(block, "LCD_SEMI_ST7735"):
                  block = disable_macro(block, "LCD_ST7735")
                  block = enable_macro(block, "LCD_SEMI_ST7735")
              else:
                  block = re.sub(
                      r"(?m)^(\s*)(?://\s*)?#define\s+LCD_ST7735\b",
                      r"\1#define LCD_SEMI_ST7735",
                      block,
                      count=1,
                  )
          else:
              block = enable_macro(block, "LCD_ST7735")
              block = disable_macro(block, "LCD_SEMI_ST7735")

          # AY-AT PORTD bit-bang SPI pinout
          for macro, val in [
              ("LCD_PORT", "PORTD"),
              ("LCD_DDR", "DDRD"),
              ("LCD_RES", "PD0"),
              ("LCD_CS", "PD5"),
              ("LCD_DC", "PD1"),
              ("LCD_SCL", "PD2"),
              ("LCD_SDA", "PD3"),
              ("LCD_DOTS_X", "128"),
              ("LCD_DOTS_Y", "160"),
          ]:
              block = set_macro_first(block, macro, val)

          block = enable_macro(block, "LCD_ROTATE")
          block = enable_macro(block, "LCD_LATE_ON")
          block = enable_macro(block, "SPI_BITBANG")
          block = disable_macro(block, "SPI_HARDWARE")

          for flag, env_key in [
              ("LCD_FLIP_X", "LCD_FLIP_X"),
              ("LCD_FLIP_Y", "LCD_FLIP_Y"),
              ("LCD_BGR", "LCD_BGR"),
          ]:
              block = enable_macro(block, flag) if os.environ[env_key] == "true" else disable_macro(block, flag)

          for off_macro, env_key in [("LCD_OFFSET_X", "LCD_OFFSET_X"), ("LCD_OFFSET_Y", "LCD_OFFSET_Y")]:
              val = int(os.environ[env_key] or "0")
              block = set_macro_first(block, off_macro, str(val)) if val > 0 else disable_macro(block, off_macro)

          # Select font & symbol set
          block = re.sub(r"(?m)^(\s*)(#define\s+FONT_\w+)", r"\1//\2", block)
          block = enable_macro(block, "FONT_10X16_HF")
          block = re.sub(r"(?m)^(\s*)(#define\s+SYMBOLS_\w+)", r"\1//\2", block)
          block = enable_macro(block, os.environ["SYMBOLS"])

          c328_text = "".join(lines[: st_start + 1]) + block + "".join(lines[st_end:])
          c328_text = set_macro_first(c328_text, "ENCODER_A", "PD1")
          c328_text = set_macro_first(c328_text, "ENCODER_B", "PD3")
          c328_path.write_text(c328_text, encoding=ENC)

          # 3. Patch config.h — AY-AT hardware baseline
          cfg_path = src_dir / "config.h"
          cfg = cfg_path.read_text(encoding=ENC)

          base_enable = [
              "HW_ENCODER",
              "HW_FREQ_COUNTER_BASIC",
              "HW_ZENER",
              "ZENER_UNSWITCHED",
              "UI_AUTOHOLD",
              "POWER_OFF_TIMEOUT",
              "SW_POWER_OFF",
              "UI_COLORED_TITLES",
              "UI_COLORED_CURSOR",
              "UI_PROBE_COLORS",
              "UI_MENU_PAGEMODE",
          ]
          for m in base_enable:
              cfg = enable_macro(cfg, m)

          cfg = set_macro_first(cfg, "ENCODER_PULSES", "4")
          cfg = set_macro_first(cfg, "ENCODER_STEPS", "20")

          if os.environ["HW_REF25"] == "true":
              cfg = enable_macro(cfg, "HW_REF25")
          else:
              cfg = disable_macro(cfg, "HW_REF25")

          # Disable large/conflicting defaults before greedy packing
          for m in ["SW_IR_RECEIVER", "SW_PWM_SIMPLE", "SW_CONTRAST"]:
              cfg = disable_macro(cfg, m)

          cfg_path.write_text(cfg, encoding=ENC)
          ok, flash, ram, eeprom, err = build_and_measure()
          if not ok:
              print(err)
              sys.exit(f"ERROR: Baseline build failed (flash={flash}, eeprom={eeprom}).")
          print(f"Baseline OK: flash={flash}/{FLASH_MAX}, ram={ram}, eeprom={eeprom}/{EEPROM_MAX}")

          # 4. Greedy feature packer (stock AY-AT compatible tools, priority order)
          candidates = [
              "SW_PWM_PLUS",
              "SW_SQUAREWAVE",
              "SW_ESR_TOOL",
              "SW_CAP_LEAKAGE",
              "SW_MONITOR_RCL",
              "SW_C_VLOSS",
              "SW_REVERSE_HFE",
              "SW_OPTO_COUPLER",
              "SW_UJT",
              "SW_ENCODER",
              "SW_PHOTODIODE",
              "SW_SCHOTTKY_BJT",
              "SW_R_E24_5",
              "UI_BATTERY",
              "SW_IR_RECEIVER",
              "SW_MONITOR_R",
              "SW_MONITOR_C",
              "SW_MONITOR_L",
          ]

          good_cfg = cfg
          added, already_on, skipped = [], [], []

          for feat in candidates:
              if not has_macro(good_cfg, feat):
                  skipped.append((feat, "not present in 1.57m config.h"))
                  continue
              if re.search(rf"(?m)^\s*#define\s+{re.escape(feat)}\b", good_cfg):
                  already_on.append(feat)
                  continue

              trial = enable_macro(good_cfg, feat)
              cfg_path.write_text(trial, encoding=ENC)
              ok, f_new, r_new, e_new, _ = build_and_measure()
              if ok:
                  good_cfg = trial
                  flash, ram, eeprom = f_new, r_new, e_new
                  added.append((feat, f_new))
                  print(f" + {feat} fits (flash={f_new}/{FLASH_MAX}, eeprom={e_new}/{EEPROM_MAX})")
              else:
                  skipped.append((feat, "exceeds 32KB flash or incompatible"))
                  print(f" - {feat} skipped (overflow/incompatible)")
                  if feat == "SW_PWM_PLUS" and has_macro(good_cfg, "SW_PWM_SIMPLE"):
                      trial_fb = enable_macro(good_cfg, "SW_PWM_SIMPLE")
                      cfg_path.write_text(trial_fb, encoding=ENC)
                      ok_fb, f_fb, r_fb, e_fb, _ = build_and_measure()
                      if ok_fb:
                          good_cfg = trial_fb
                          flash, ram, eeprom = f_fb, r_fb, e_fb
                          added.append(("SW_PWM_SIMPLE (fallback)", f_fb))
                          print(f" + SW_PWM_SIMPLE fallback fits (flash={f_fb}/{FLASH_MAX})")

          # Final clean build with winning config
          cfg_path.write_text(good_cfg, encoding=ENC)
          ok, flash, ram, eeprom, err = build_and_measure()
          if not ok:
              print(err)
              sys.exit("ERROR: Final build unexpectedly failed.")

          # Prepare artifact directory & summary
          out_dir = Path("out")
          out_dir.mkdir(exist_ok=True)
          binaries = []
          for pattern in ("*.hex", "*.eep"):
              for fpath in sorted(src_dir.rglob(pattern)):
                  shutil.copy2(fpath, out_dir / fpath.name)
                  binaries.append(fpath.name)

          for fname in ["config.h", "config_328.h", "Makefile", "Clones"]:
              fpath = src_dir / fname
              if fpath.exists():
                  shutil.copy2(fpath, out_dir / fname)

          summary = [
              "# ComponentTester 1.57m Build Summary (AY-AT / 8 MHz / ST7735)",
              "",
              f"- **Binaries:** {', '.join(f'`{b}`' for b in binaries) or '(none)'}",
              f"- **Flash:** `{flash} / {FLASH_MAX} bytes` ({flash * 100 / FLASH_MAX:.1f}%)",
              f"- **RAM:** `{ram} / 2048 bytes` ({ram * 100 / 2048:.1f}%)",
              f"- **EEPROM:** `{eeprom} / {EEPROM_MAX} bytes` ({eeprom * 100 / EEPROM_MAX:.1f}%)",
              f"- **Display:** `{os.environ['LCD_DRIVER']}`, `FONT_10X16_HF`, `{os.environ['SYMBOLS']}`",
              "",
              "## Core AY-AT Features Enabled",
              ", ".join(f"`{m}`" for m in base_enable),
              "",
              "## Extra Features Packed In",
              "\n".join(f"- `{m}` (total flash: {sz} B)" for m, sz in added) or "- (none)",
              "",
              "## Already Enabled by Default",
              ", ".join(f"`{m}`" for m in already_on) or "(none)",
              "",
              "## Skipped (Flash Limit / Unavailable)",
              "\n".join(f"- `{m}` — {reason}" for m, reason in skipped) or "- (none)",
              "",
              "## Recommended Fuses (ATmega328P, 8 MHz Crystal)",
              "- `lfuse`: `0xF7` | `hfuse`: `0xD9` | `efuse`: `0xFC` (or `0x04` on older avrdude)",
          ]
          summary_text = "\n".join(summary) + "\n"
          (out_dir / "build_summary.txt").write_text(summary_text, encoding="utf-8")
          if "GITHUB_STEP_SUMMARY" in os.environ:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
                  fh.write(summary_text)
          print(summary_text)
          EOF

      - name: Upload firmware artifact (.hex, .eep, configs)
        uses: actions/upload-artifact@v4
        with:
          name: ComponentTester-1.57m-AY-AT-8MHz
          path: out/
